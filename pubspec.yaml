name: flutter_device_apps_android
description: Android implementation of flutter_device_apps (federated plugin).
version: 1.0.0
repository: https://github.com/okmsbun/flutter_device_apps_android
issue_tracker: https://github.com/okmsbun/flutter_device_apps/issues
topics:
  - flutter
  - android
  - installed-apps
  - app-management
  - package-manager

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_device_apps_platform_interface: ^1.0.0

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: flutter_device_apps
    platforms:
      android:
        package: com.okmsbun.flutter_device_apps_android
        pluginClass: FlutterDeviceAppsAndroidPlugin
        dartPluginClass: FlutterDeviceAppsAndroid
