name: flutter_device_apps_android
description: Flutter plugin for Android app discovery, management, and packaged technology detection.
version: 2.2.0
repository: https://github.com/okmsbun/flutter_device_apps_android
issue_tracker: https://github.com/okmsbun/flutter_device_apps_android/issues
topics:
  - installed-apps
  - app-management
  - package-manager

platforms:
  android:

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.okmsbun.flutter_device_apps_android
        pluginClass: FlutterDeviceAppsAndroidPlugin
